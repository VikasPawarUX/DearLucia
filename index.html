<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf1e5">
<meta name="description" content="Restore a painted family portrait in a quiet wooden sliding puzzle.">
<meta property="og:title" content="Dear Lucia: Pieces of a Life">
<meta property="og:description" content="Restore Lucia’s painted memories in a quiet wooden sliding puzzle.">
<meta property="og:image" content="https://www.vikaspawar.online/dearlucia/icon-512.png">
<meta property="og:image:alt" content="Dear Lucia game icon">
<link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%site.webmanifest">
<title>Dear Lucia</title>
</head>
<body>
<div id="splash" class="splash" role="status">
  <div id="splash-title" class="splash-title is-painting">
    <img id="splash-artwork" src="./assets/title.webp" width="978" height="476" alt="Dear Lucia: Pieces of a Life" fetchpriority="high">
  </div>
  <footer class="splash-credit">© 2026 Vikas Pawar</footer>
</div>
<main class="game">
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <mask id="flourish-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="58">
      <path id="flourish-pen" pathLength="1" d="M160 30C134 38 112 8 87 30S80 64 52 38 33 11 11 28L0 34" fill="none" stroke="white" stroke-width="72" stroke-linecap="round"/>
    </mask>
    <symbol id="flourish" viewBox="0 0 160 58">
      <path pathLength="1" d="M159 31c-20 4-36-9-57-8-20 1-30 13-19 19 9 5 21-5 12-10 3 5-4 10-9 8-8-4 2-13 17-13 20-1 38 9 56 4Z"/>
      <path pathLength="1" d="M104 30c5 12-11 23-31 21-18-2-29-15-27-26 1-7 7-12 12-11 6 1 8 8 5 12-2 3-6 2-7-1 3 0 4-3 2-4-5-2-8 6-6 12 5 12 20 17 32 15 11-1 22-9 20-18Z"/>
      <path pathLength="1" d="M44 34C29 28 18 16 23 1c14 5 24 19 21 33ZM40 39C26 30 10 27 1 32c7 11 24 15 39 7ZM47 43c-15-1-24 6-24 14 10 1 19-5 24-14Z"/>
    </symbol>
  </svg>
  <div id="story-viewport" class="story-viewport">
    <div id="story" class="story" hidden>
      <header class="memory-heading">
        <div id="memory-label" class="memory-label">
          <svg viewBox="0 0 360 52" preserveAspectRatio="none" aria-hidden="true">
            <path d="M23 3h314q7 0 8 8 8 2 9 10l5 5-5 5q-1 8-9 10-1 8-8 8H23q-7 0-8-8-8-2-9-10l-5-5 5-5q1-8 9-10 1-8 8-8Z" fill="#ffe6bd" stroke="currentColor" stroke-width="2.5" stroke-opacity=".55"/>
            <path d="M24 7h312m0 38H24" fill="none" stroke="currentColor" stroke-opacity=".24"/>
            <circle cx="20" cy="26" r="3" fill="currentColor"/><circle cx="340" cy="26" r="3" fill="currentColor"/>
          </svg>
          <span id="memory-number" class="memory-number"></span>
        </div>
        <div class="title-row">
          <svg class="flourish" viewBox="0 0 160 58" aria-hidden="true"><use href="#flourish" mask="url(#flourish-mask)"/></svg>
          <h1 id="memory-title" class="memory-title"></h1>
          <svg class="flourish mirrored" viewBox="0 0 160 58" aria-hidden="true"><use href="#flourish" mask="url(#flourish-mask)"/></svg>
        </div>
        <svg id="title-divider" class="title-divider" viewBox="0 0 440 10" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="divider-ink" gradientUnits="userSpaceOnUse" x1="0" x2="440" y1="0" y2="0"><stop stop-color="currentColor" stop-opacity="0"/><stop offset=".5" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
          <path class="divider-stroke" pathLength="1" d="M220 5H0" fill="none" stroke="url(#divider-ink)" stroke-width="1.7"/>
          <path class="divider-stroke" pathLength="1" d="M220 5h220" fill="none" stroke="url(#divider-ink)" stroke-width="1.7"/>
          <path class="divider-diamond" d="m220 1 4 4-4 4-4-4Z" fill="currentColor"/>
        </svg>
      </header>
    <section id="board" class="frame" aria-label="Sliding painting puzzle">
      <div class="frame-wood" aria-hidden="true"><div class="frame-rabbet"></div></div>
      <div class="picture">
        <div id="backing" class="backing" aria-hidden="true"></div>
        <div id="tiles" class="tiles" aria-hidden="true"></div>
        <div id="painting" class="painting" aria-hidden="true"></div>
        <div id="shine" class="completion-shine" aria-hidden="true"></div>
        <div id="controls" class="controls"></div>
        <svg id="tutorial" class="tutorial" viewBox="0 0 40 46" aria-hidden="true" hidden>
          <circle class="tutorial-tap-ring" cx="25" cy="6.4" r="4.5" opacity="0">
            <animate attributeName="r" dur="1.9s" repeatCount="indefinite" keyTimes="0;.42;.44;.56;.78;1" values="4.5;4.5;6.3;10.6;14;14"/>
            <animate attributeName="opacity" dur="1.9s" repeatCount="indefinite" keyTimes="0;.42;.44;.56;.78;1" values="0;0;.9;.72;0;0"/>
          </circle>
          <g class="tutorial-hand">
            <path d="M12 19C14 13 17 6 21 3.5c3-2 7-.5 7.8 3 .9 3.4-1.2 8-2.8 11.5 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z" fill="#fff2d3" stroke="#784829" stroke-width="1.7" stroke-linejoin="round">
              <animate attributeName="d" dur="1.9s" repeatCount="indefinite"
                keyTimes="0;.28;.43;.49;.74;1" calcMode="spline"
                keySplines="0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1;0 0 1 1"
                values="M12 19C14 13 17 6 21 3.5c3-2 7-.5 7.8 3 .9 3.4-1.2 8-2.8 11.5 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z;
                        M12 19C14 13 17 6 21 3.5c3-2 7-.5 7.8 3 .9 3.4-1.2 8-2.8 11.5 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z;
                        M12 19C14 14 17 8.4 21 5.9c3-2 7-.5 7.8 3 .9 3.4-1.2 5.6-2.8 9.1 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z;
                        M12 19C14 14 17 8.4 21 5.9c3-2 7-.5 7.8 3 .9 3.4-1.2 5.6-2.8 9.1 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z;
                        M12 19C14 13 17 6 21 3.5c3-2 7-.5 7.8 3 .9 3.4-1.2 8-2.8 11.5 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z;
                        M12 19C14 13 17 6 21 3.5c3-2 7-.5 7.8 3 .9 3.4-1.2 8-2.8 11.5 2.7-1 5.2.2 6.1 2.4 2.1-.2 4.1 1.4 5 3.5 3.3 7.4-.3 15.9-7.4 19.1-5.6 2.5-13.6 1.3-19.2-2.3C4.8 37 2 31.7 3 26.4c.8-4.2 4-7.1 9-7.4Z"/>
            </path>
            <path d="M12 19c-.8 2-1.5 4.3-1.8 6.1" fill="none" stroke="#784829" stroke-width="1.3" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </section>
      <footer class="memory-footer">
        <p id="move-count" class="move-count"></p>
        <div id="memory-caption" class="memory-caption">
        <p id="narration" class="narration"></p>
        <div class="ornamental-divider closing-ornament" aria-hidden="true"><i></i></div>
        </div>
        <div id="epilogue" class="epilogue" hidden>
          <div class="epilogue-message" aria-live="polite">
            <p>Every life is a collection of little moments.</p>
            <p class="epilogue-signature">Thank you for being part of mine. — Lucia</p>
          </div>
        </div>
      </footer>
    </div>
  </div>
  <div class="game-actions" role="group" aria-label="Puzzle actions">
    <button id="settings-button" type="button" class="corner-button settings-button" aria-label="Settings" aria-haspopup="dialog" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
        <circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>
      </svg>
    </button>
    <button id="hint-button" type="button" class="corner-button hint-button" aria-label="Hint" disabled>
      <span id="hint-count" class="hint-count" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 16c0-2-3-3-3-7a6 6 0 1 1 12 0c0 4-3 5-3 7H9Zm.5 3h5M11 21h2"/>
      </svg>
    </button>
    <button id="restart-button" type="button" class="corner-button restart-button" aria-label="Restart puzzle" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 10a7.2 7.2 0 1 1 .7 6.7M5 5v5h5"/>
      </svg>
    </button>
    <button id="return-home" class="corner-button return-home" type="button" aria-label="Return Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3.5 11 8.5-7 8.5 7M6 9v10h4v-5h4v5h4V9"/>
      </svg>
    </button>
  </div>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <button id="close-settings" class="settings-close" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
      <div id="settings-controls" class="settings-panel">
        <h2 id="settings-title">Settings</h2>
        <div class="settings-buttons">
          <button id="toggle-music" class="round-button sound-toggle" type="button" aria-pressed="true" aria-label="Music" title="Music">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 17.5V5.5l10-2v12"/>
              <path d="M9 17.5a2.6 2.1 0 1 1-5.2 0 2.6 2.1 0 1 1 5.2 0Zm10-2a2.6 2.1 0 1 1-5.2 0 2.6 2.1 0 1 1 5.2 0Z"/>
              <path class="sound-off-slash" d="m4 4 16 16"/>
            </svg>
          </button>
          <button id="toggle-effects" class="round-button sound-toggle" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5.5 6.5 9H3.5v6h3l4.5 3.5v-13Z"/>
              <path class="sound-waves" d="M15 9.2a4 4 0 0 1 0 5.6m2.8-8.4a8 8 0 0 1 0 11.2"/>
              <path class="sound-off-slash" d="m15 9.5 5 5m0-5-5 5"/>
            </svg>
          </button>
          <button id="delete-progress" class="round-button danger-button" type="button" aria-label="Delete progress" title="Delete progress">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12M10 11v6m4-6v6"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="delete-progress-panel" class="settings-panel" hidden>
        <h2 id="delete-progress-title">Delete progress?</h2>
        <p id="delete-progress-description">Your saved memory progress will be cleared and you’ll return to Memory 1.</p>
        <p id="delete-progress-error" role="alert" hidden>Saved progress couldn’t be cleared. Please try again.</p>
        <div class="settings-actions">
          <button id="cancel-delete-progress" class="round-button" type="button" aria-label="Cancel" title="Cancel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
          <button id="confirm-delete-progress" class="round-button danger-button is-solid" type="button" aria-label="Delete progress" title="Delete progress">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"/></svg>
          </button>
        </div>
      </div>
    </form>
  </dialog>
  <canvas id="particles" aria-hidden="true" hidden></canvas>
  <div id="status" class="sr-only" role="status"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
