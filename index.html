<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf1e5">
<meta name="description" content="Restore a sunflower painting in a quiet wooden sliding puzzle.">
<title>Toy Slide</title>
</head>
<body>
<main class="game">
  <section id="board" class="frame" aria-label="Sliding painting puzzle">
    <div class="frame-rails" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="frame-rabbet" aria-hidden="true"></div>
    <div class="picture">
      <div id="tiles" class="tiles" aria-hidden="true"></div>
      <div id="painting" class="painting" aria-hidden="true"></div>
      <div id="controls" class="controls"></div>
    </div>
  </section>
  <div id="particles" aria-hidden="true"></div>
  <div id="status" class="sr-only" role="status"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
